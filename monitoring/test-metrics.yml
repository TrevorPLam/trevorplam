# Enterprise Test Metrics Configuration
# 2026 Standards for Test Monitoring and Observability

version: "2.0"
name: "enterprise-test-metrics"
description: "Comprehensive test monitoring and metrics collection for enterprise parallel testing"

# Metrics Collection Configuration
metrics:
  # Performance Metrics
  performance:
    enabled: true
    interval: 30s
    retention: 30d
    metrics:
      - name: "test_execution_time"
        type: "histogram"
        buckets: [1s, 5s, 10s, 30s, 60s, 120s, 300s, 600s]
        labels: ["test_type", "shard", "browser"]
      
      - name: "test_throughput"
        type: "gauge"
        labels: ["test_type", "worker"]
      
      - name: "resource_utilization"
        type: "gauge"
        labels: ["resource_type", "worker"]
        resources: ["cpu", "memory", "disk_io", "network"]

  # Quality Metrics
  quality:
    enabled: true
    interval: 60s
    retention: 90d
    metrics:
      - name: "test_success_rate"
        type: "gauge"
        labels: ["test_type", "shard"]
      
      - name: "test_flakiness"
        type: "gauge"
        labels: ["test_file"]
        threshold: 0.05  # 5% flakiness threshold
      
      - name: "code_coverage"
        type: "gauge"
        labels: ["test_type", "metric_type"]
        metric_types: ["lines", "functions", "branches", "statements"]

  # Parallel Execution Metrics
  parallel:
    enabled: true
    interval: 15s
    retention: 7d
    metrics:
      - name: "shard_variance"
        type: "gauge"
        labels: ["test_type"]
        threshold: 0.20  # 20% variance threshold
      
      - name: "worker_efficiency"
        type: "gauge"
        labels: ["worker_id", "test_type"]
      
      - name: "queue_depth"
        type: "gauge"
        labels: ["queue_type"]
        queue_types: ["pending", "running", "completed"]

# Alerting Configuration
alerts:
  # Performance Alerts
  performance:
    - name: "high_execution_time"
      condition: "test_execution_time > 300s"
      severity: "warning"
      action: "notify_dev_team"
      
    - name: "low_throughput"
      condition: "test_throughput < 0.5 tests/sec"
      severity: "critical"
      action: "scale_resources"
      
    - name: "resource_exhaustion"
      condition: "resource_utilization > 90%"
      severity: "critical"
      action: "emergency_scale"

  # Quality Alerts
  quality:
    - name: "low_success_rate"
      condition: "test_success_rate < 95%"
      severity: "warning"
      action: "investigate_failures"
      
    - name: "high_flakiness"
      condition: "test_flakiness > 5%"
      severity: "warning"
      action: "stabilize_tests"
      
    - name: "coverage_drop"
      condition: "code_coverage < 80%"
      severity: "warning"
      action: "review_coverage"

  # Parallel Execution Alerts
  parallel:
    - name: "high_variance"
      condition: "shard_variance > 20%"
      severity: "warning"
      action: "rebalance_shards"
      
    - name: "worker_inefficiency"
      condition: "worker_efficiency < 70%"
      severity: "warning"
      action: "optimize_distribution"
      
    - name: "queue_backlog"
      condition: "queue_depth > 10"
      severity: "critical"
      action: "scale_workers"

# Dashboard Configuration
dashboards:
  - name: "test-execution-overview"
    title: "Test Execution Overview"
    panels:
      - title: "Execution Time Trend"
        type: "timeseries"
        metrics: ["test_execution_time"]
        aggregation: "avg"
        
      - title: "Success Rate by Type"
        type: "stat"
        metrics: ["test_success_rate"]
        group_by: ["test_type"]
        
      - title: "Resource Utilization"
        type: "heatmap"
        metrics: ["resource_utilization"]
        group_by: ["resource_type", "worker"]

  - name: "parallel-execution-details"
    title: "Parallel Execution Details"
    panels:
      - title: "Shard Distribution"
        type: "pie"
        metrics: ["test_execution_time"]
        group_by: ["shard"]
        
      - title: "Worker Efficiency"
        type: "bar"
        metrics: ["worker_efficiency"]
        group_by: ["worker_id"]
        
      - title: "Queue Status"
        type: "stat"
        metrics: ["queue_depth"]
        group_by: ["queue_type"]

  - name: "quality-metrics"
    title: "Quality Metrics Dashboard"
    panels:
      - title: "Test Flakiness Heatmap"
        type: "heatmap"
        metrics: ["test_flakiness"]
        group_by: ["test_file"]
        
      - title: "Code Coverage Trend"
        type: "timeseries"
        metrics: ["code_coverage"]
        group_by: ["metric_type"]

# Data Collection Configuration
collection:
  # Test Result Collection
  test_results:
    enabled: true
    formats: ["json", "junit", "allure"]
    sources:
      - path: "results-*.json"
        pattern: "results-{test_type}-{shard}.json"
      - path: "tests/reports/"
        pattern: "**/*.xml"
    
    extraction:
      - field: "numTotalTests"
        metric: "test_total_count"
      - field: "numPassedTests"
        metric: "test_passed_count"
      - field: "numFailedTests"
        metric: "test_failed_count"
      - field: "numPendingTests"
        metric: "test_skipped_count"

  # System Metrics Collection
  system_metrics:
    enabled: true
    interval: 10s
    sources:
      - type: "cpu"
        command: "ps aux"
        parser: "cpu_usage"
      - type: "memory"
        command: "free -m"
        parser: "memory_usage"
      - type: "disk"
        command: "df -h"
        parser: "disk_usage"

# Integration Configuration
integrations:
  # Prometheus Integration
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    scrape_interval: 15s
    
  # Grafana Integration
  grafana:
    enabled: true
    url: "http://grafana:3000"
    api_key: "${GRAFANA_API_KEY}"
    dashboard_import:
      overwrite: true
      folder: "test-metrics"

  # Slack Integration
  slack:
    enabled: true
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channels:
      - "#test-alerts"
      - "#dev-ops"
    
    message_templates:
      critical: "CRITICAL: {{.AlertName}} - {{.Condition}} - {{.Action}}"
      warning: "WARNING: {{.AlertName}} - {{.Condition}} - {{.Action}}"
      info: "INFO: {{.AlertName}} - {{.Condition}}"

# Performance Thresholds
thresholds:
  execution_time:
    unit: 30s
    components: 60s
    integration: 120s
    e2e: 300s
    accessibility: 180s
    performance: 240s
    security: 90s
    contract: 45s
    
  resource_utilization:
    cpu_warning: 75%
    cpu_critical: 90%
    memory_warning: 80%
    memory_critical: 95%
    disk_io_warning: 70%
    disk_io_critical: 85%
    
  quality:
    success_rate_warning: 95%
    success_rate_critical: 90%
    flakiness_warning: 5%
    flakiness_critical: 10%
    coverage_warning: 80%
    coverage_critical: 70%

# Optimization Rules
optimization:
  auto_rebalance:
    enabled: true
    threshold: 20%  # Variance threshold
    action: "redistribute_shards"
    
  auto_scale:
    enabled: true
    scale_up_threshold: 85%  # Resource utilization
    scale_down_threshold: 30%
    min_workers: 2
    max_workers: 8
    
  auto_retry:
    enabled: true
    max_retries: 3
    backoff_strategy: "exponential"
    retry_conditions:
      - "network_timeout"
      - "resource_exhaustion"
      - "flaky_test_failure"

# Reporting Configuration
reporting:
  # Daily Reports
  daily:
    enabled: true
    time: "08:00"
    recipients: ["dev-team@company.com"]
    sections:
      - "execution_summary"
      - "performance_trends"
      - "quality_metrics"
      - "resource_utilization"
    
  # Weekly Reports
  weekly:
    enabled: true
    day: "monday"
    time: "09:00"
    recipients: ["management@company.com", "dev-team@company.com"]
    sections:
      - "weekly_summary"
      - "trend_analysis"
      - "optimization_recommendations"
      - "capacity_planning"
    
  # Incident Reports
  incident:
    enabled: true
    trigger: "critical_alert"
    recipients: ["sre@company.com", "dev-team@company.com"]
    sections:
      - "incident_summary"
      - "root_cause_analysis"
      - "impact_assessment"
      - "resolution_actions"

# Data Retention Policies
retention:
  metrics:
    raw_data: 7d
    aggregated_1m: 30d
    aggregated_5m: 90d
    aggregated_1h: 1y
    
  logs:
    orchestration: 30d
    test_execution: 90d
    system_metrics: 7d
    
  reports:
    daily: 90d
    weekly: 1y
    incident: 3y

# Security Configuration
security:
  authentication:
    enabled: true
    method: "oauth2"
    providers: ["github", "google"]
    
  authorization:
    roles:
      - name: "viewer"
        permissions: ["read"]
      - name: "analyst"
        permissions: ["read", "query"]
      - name: "admin"
        permissions: ["read", "write", "delete", "configure"]
    
  audit:
    enabled: true
    log_actions: ["create", "update", "delete", "configure"]
    retention: 1y
