version: '3.8'

services:
  # Master orchestrator service
  test-master:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    container_name: test-master
    environment:
      - NODE_ENV=test
      - ROLE=master
      - WORKER_COUNT=4
      - REDIS_URL=redis://redis:6379
      - API_PORT=3001
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./test-results:/app/test-results
    depends_on:
      - redis
      - postgres
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker nodes (scaled based on WORKER_COUNT)
  test-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    environment:
      - NODE_ENV=test
      - ROLE=worker
      - REDIS_URL=redis://redis:6379
      - MASTER_URL=http://test-master:3001
    volumes:
      - ./logs:/app/logs
      - ./test-results:/app/test-results
    depends_on:
      - test-master
      - redis
    networks:
      - test-network
    restart: unless-stopped
    deploy:
      replicas: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for distributed coordination and caching
  redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for distributed result storage
  postgres:
    image: postgres:15-alpine
    container_name: test-postgres
    environment:
      - POSTGRES_DB=test_results
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_results"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring dashboard
  test-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: test-dashboard
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://test_user:test_password@postgres:5432/test_results
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres
      - test-master
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx load balancer for API endpoints
  nginx:
    image: nginx:alpine
    container_name: test-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - test-master
      - test-dashboard
    networks:
      - test-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
