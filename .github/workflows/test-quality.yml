name: Test Quality Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/**/*'
      - 'tests/utils/**/*'
      - '*.config.*'
      - 'vitest.config.ts'
      - 'playwright.config.ts'

jobs:
  test-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint test files
        run: |
          npx eslint tests/**/*.{ts,js} --ext .ts,.js --max-warnings 0
          npx eslint tests/utils/**/*.{ts,js} --ext .ts,.js --max-warnings 0
        
      - name: Type check test files
        run: npx tsc --noEmit tests/**/*
        
      - name: Run unit tests
        run: npm test -- --run --reporter=json
        
      - name: Check test coverage
        run: |
          npm test -- --coverage --reporter=json
          if [ $? -eq 0 ]; then
            echo "✅ All tests passed"
          else
            echo "❌ Some tests failed"
            exit 1
          fi
        
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30
