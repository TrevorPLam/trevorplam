name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright browsers
      run: npx playwright install chromium firefox webkit --with-deps
      
    - name: Run unit tests with coverage
      run: npm test -- --coverage
      
    - name: Check coverage thresholds
      run: |
        if [ ! -f "tests/reports/coverage/lcov.info" ]; then
          echo "::error::Coverage report not found"
          exit 1
        fi
        
        echo "📊 Checking coverage thresholds..."
        
        # Run coverage with JSON output to check thresholds
        npm test -- --coverage --reporter=json > tests/reports/coverage-results.json
        
        # Extract global coverage percentage (basic check)
        COVERAGE_LINES=$(cat tests/reports/coverage-results.json | jq -r '.coverage.global.lines // 0' 2>/dev/null || echo "0")
        
        echo "Current line coverage: ${COVERAGE_LINES}%"
        echo "Required minimum: 80%"
        
        if (( $(echo "$COVERAGE_LINES < 80" | bc -l) )); then
          echo "::error::Coverage ${COVERAGE_LINES}% is below 80% threshold"
          echo "Please add more tests to meet the minimum coverage requirement"
          exit 1
        fi
        
        echo "✅ Coverage thresholds passed"
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./tests/reports/coverage/lcov.info
        fail_ci_if_error: true
        
    - name: Build project
      run: npm run build
      
    - name: Check Performance Budgets
      run: |
        echo "📊 Checking performance budgets..."
        
        # Set budget thresholds
        MAX_BUNDLE_SIZE_KB=1000  # 1MB
        MAX_BUILD_TIME_MS=120000  # 2 minutes
        
        # Check dist folder size
        if [ -d "dist" ]; then
          BUNDLE_SIZE=$(du -sb dist/ | cut -f1)
          BUNDLE_SIZE_KB=$((BUNDLE_SIZE / 1024))
          
          echo "Bundle size: ${BUNDLE_SIZE_KB}KB (max: ${MAX_BUNDLE_SIZE_KB}KB)"
          
          if [ $BUNDLE_SIZE_KB -gt $MAX_BUNDLE_SIZE_KB ]; then
            echo "::warning::Bundle size (${BUNDLE_SIZE_KB}KB) exceeds budget (${MAX_BUNDLE_SIZE_KB}KB)"
          else
            echo "✅ Bundle size within budget"
          fi
          
          # Check specific asset sizes
          echo "Asset breakdown:"
          find dist -type f -name "*.js" -o -name "*.css" | while read file; do
            SIZE=$(du -k "$file" | cut -f1)
            echo "  - $file: ${SIZE}KB"
            
            # Flag oversized JS files (>500KB)
            if [[ $file == *.js ]] && [ $SIZE -gt 500 ]; then
              echo "::warning::Large JS file detected: $file (${SIZE}KB > 500KB)"
            fi
          done
        else
          echo "::warning::Dist folder not found"
        fi
        
        echo "✅ Performance budget check complete"
      
    - name: Run E2E tests
      run: npm run test:e2e
      
    - name: Run accessibility tests
      run: npm run test:a11y
      
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: tests/reports/
        retention-days: 30
